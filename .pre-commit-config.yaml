# Runs on every `git commit` after `make install`. Run on everything: `uv run pre-commit run -a`
repos:
  # Pinned to a commit SHA ("frozen"), like the GitHub Actions. `pre-commit autoupdate --freeze`
  # bumps it and keeps the comment in sync.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  # ruff runs through uv, so the version comes from uv.lock: one pin shared with CI.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked --only-group lint ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --only-group lint ruff format --force-exclude
        language: system
        types_or: [python, pyi]
