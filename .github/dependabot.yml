# Dependabot opens PRs when dependencies have updates or security fixes. CI runs on each PR,
# so only upgrades that pass lint, types, tests, the smoke test and the Trivy scan get merged.
#
# cooldown: wait 7 days after a release before proposing it, matching `exclude-newer` in
# pyproject.toml. Most malicious or broken releases are found and pulled within days.
# (Security updates ignore the cooldown, as they should.)
version: 2
updates:
  # Action SHAs in .github/workflows/; the version comment is updated too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base image digests in the Dockerfile (python and uv).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]

  # uv.lock. One grouped PR for the ML stack, since these packages depend on each other.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ml:
        patterns:
          - "torch"
          - "sentence-transformers"
          - "transformers"
          - "tokenizers"
          - "huggingface-hub"
          - "safetensors"
          - "faiss-cpu"
          - "numpy"
          - "scipy"
          - "scikit-learn"
      web:
        patterns: ["fastapi", "starlette", "uvicorn", "pydantic", "pydantic-*"]
      dev-tools:
        patterns: ["ruff", "mypy", "pytest", "httpx", "pre-commit"]
