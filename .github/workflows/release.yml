# Release: a version tag publishes the image to GitHub Container Registry.
#   git tag v0.1.0 && git push origin v0.1.0
# Merging a change to .github/RELEASE does the same thing as the merging account
# (see release-request.yml). CI runs on the tagged commit first; nothing is published
# unless it passes. Release tags are protected by the "Protect release tags" ruleset.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ github.ref_name }}
