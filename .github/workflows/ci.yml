# Continuous integration: every pull request and every push to main.
# Cheap checks run in parallel first; the slow Docker job runs only if they all pass.
# Every step calls a `make` target, so any failure can be reproduced locally with that target.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Lets release.yml run this exact pipeline on the tagged commit before publishing.
  workflow_call:

# Least privilege: the GITHUB_TOKEN can only read the repo. Jobs ask for more if they need it.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the now-outdated run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shows ruff findings as inline annotations on the PR diff.
  RUFF_OUTPUT_FORMAT: github
  FORCE_COLOR: "1"

# Actions are pinned to full commit SHAs: a tag can be moved to point at different code, a
# SHA can't. Dependabot updates the SHA and the version comment together.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: make typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - run: make test

  docker:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ssv2:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The equivalent of `make docker-build`, plus a layer cache stored in GitHub Actions so
      # unchanged layers (PyTorch above all) aren't rebuilt on every run.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true # make the image available to `docker run` below
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: make smoke-test IMAGE="$IMAGE"
      - name: Scan the image for vulnerabilities (Trivy)
        run: make scan IMAGE="$IMAGE"
